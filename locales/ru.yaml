dialog_choose_html: |
  <b>Голосовой диалог</b>

  Выберите ситуацию. Я буду говорить голосом и держать роль, а ошибки разберу в конце — чтобы разговор не прерывался.
  Отвечать можно голосом, текстом или кнопкой-подсказкой.
