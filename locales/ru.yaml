welcome_html: |
  <b>Добро пожаловать в AI English Tutor!</b>

  Я твой персональный ИИ-преподаватель. Наш формат обучения — <b>50/50</b>:
  1. Ты можешь писать мне обычные <b>текстовые сообщения</b>.
  2. Или записывать <b>голосовые сообщения (Voice)</b>, чтобы тренировать Speaking!

welcome_start_html: "<i>Let's start! Tell me, what did you do today?</i>"

