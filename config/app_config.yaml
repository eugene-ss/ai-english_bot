llm:
  # Groq by default. Options: "gemini" or "groq"
  # active_text_provider: "gemini"
  active_text_provider: "groq"

  gemini:
    model_id: "gemini-2.5-flash"
    temperature: 0.5

  groq:
    model_id: "openai/gpt-oss-20b"
    temperature: 0.5
    # gpt-oss без этого параметра тратит на размышления весь max_tokens и возвращает
    # пустой content. Для моделей без reasoning оставить пустую строку.
    reasoning_effort: "low"

  # Ограничивают длину ответа и время ожидания провайдера
  max_tokens: 700
  timeout_s: 45.0

stt:
  model_id: "whisper-large-v3"
  timeout_s: 60.0

tts:
  enabled: true
  # Groq Orpheus
  model_id: "canopylabs/orpheus-v1-english"
  voice: "autumn"
  max_chars: 200
  timeout_s: 45.0
  # После стольких ошибок подряд озвучка отключается на cooldown_s секунд
  failure_threshold: 3
  cooldown_s: 300.0
  # Кнопка «медленнее»: ffmpeg atempo, допустимый диапазон 0.5-2.0
  slow_tempo: 0.75
  # Сколько храним Telegram file_id, чтобы не синтезировать фразу заново
  cache_ttl_s: 2592000

dialog:
  enabled: true
  # Лимиты удерживают расходы: каждая реплика это STT + LLM + TTS
  max_turns: 8
  max_duration_s: 1800
  hints_count: 3
  max_reply_chars: 160

bot:
  max_history_len: 12
  use_redis: true
  session_ttl_s: 172800
  max_voice_duration_s: 180
  max_voice_size_bytes: 20971520
  min_request_interval_s: 1.0
  redis_retry_interval_s: 30.0
